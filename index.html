<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#14100c">
<title>和牌 · 灰盒原型</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23c9a227'/%3E%3Crect x='7' y='7' width='18' height='18' rx='3' fill='%231d1712'/%3E%3C/svg%3E">
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<div id="app">

  <header class="hud">
    <div class="hud-cell">
      <span class="hud-k">进度</span>
      <span class="hud-v" id="hudRound">—</span>
    </div>
    <div class="hud-cell hud-cell--mid">
      <span class="hud-k">铜钱</span>
      <span class="hud-v" id="hudMoney">0</span>
    </div>
    <div class="hud-cell hud-cell--right">
      <button class="icon-btn" id="btnMenu" title="菜单">☰</button>
    </div>
  </header>

  <section class="board">
    <div class="board-top">
      <div class="target">
        <span class="target-label">目标</span>
        <span class="target-value" id="targetValue">0</span>
      </div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="progress">
      <div class="bar"><i id="progressBar"></i></div>
      <div class="progress-nums">
        <span id="scoreValue">0</span>
        <span class="progress-sep">/</span>
        <span id="scoreTarget">0</span>
      </div>
    </div>
  </section>

  <section class="joker-strip" id="jokerStrip"></section>

  <section class="hand-area">
    <div class="preview" id="preview"></div>
    <div class="hand" id="hand"></div>
  </section>

  <footer class="controls">
    <div class="counters">
      <span class="counter" id="playsLeft">出牌 —</span>
      <span class="counter" id="discardsLeft">换牌 —</span>
      <button class="mini-btn" id="btnTenpai">听牌</button>
    </div>
    <div class="actions">
      <button class="btn btn--hint" id="btnHint" title="自动打出当前最高分的牌型">提示</button>
      <button class="btn btn--ghost" id="btnDiscard" disabled>换牌</button>
      <button class="btn btn--primary" id="btnPlay" disabled>和牌</button>
    </div>
  </footer>

  <div class="fx" id="fx" aria-hidden="true"></div>
  <div class="modal-root" id="modalRoot" hidden></div>

</div>

<script src="src/tiles.js"></script>
<script src="src/hand.js"></script>
<script src="src/content.js"></script>
<script src="src/game.js"></script>
<script src="src/ui.js"></script>
<script src="src/fx.js"></script>
<script src="src/main.js"></script>
</body>
</html>
